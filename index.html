<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Energy Hub">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Energy Hub | 智能同步能量站</title>
    <style>
        :root { --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #2c3e50; --text-muted: #7f8c8d; --primary: #6c5ce7; --primary-light: #a29bfe; --accent: #00b894; --border-radius: 16px; --shadow: 0 8px 30px rgba(0,0,0,0.04); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1300px; display: grid; grid-template-columns: 1fr 380px; gap: 2rem; }
        header { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        header h1 { font-size: 1.8rem; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 10px; }
        header h1::before { content: '✨'; }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.01); }
        .card h2 { font-size: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .task-pool { display: flex; flex-direction: column; gap: 1.2rem; }
        #pool-container { display: flex; flex-direction: column; gap: 1.2rem; }
        .category-block { background: rgba(108, 92, 231, 0.02); padding: 1.2rem; border-radius: 12px; border-left: 4px solid var(--primary); cursor: grab; transition: transform 0.2s, box-shadow 0.2s; }
        .category-block.dragging { opacity: 0.5; background: #efecfd; }
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
        .category-title { font-weight: 600; font-size: 0.95rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid transparent; padding: 2px 6px; border-radius: 4px; cursor: text; }
        .category-title:focus { background: white; border-color: var(--primary-light); outline: none; }
        .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; padding: 2px 4px; border-radius: 4px; }
        .task-list { display: flex; flex-wrap: wrap; gap: 0.6rem; min-height: 35px; padding: 4px; border-radius: 8px; background: rgba(0,0,0,0.01); }
        .task-list.drag-over { border-color: var(--primary-light); background: rgba(108, 92, 231, 0.05); }
        .task-item { background: var(--card-bg); padding: 0.4rem 0.9rem; border-radius: 20px; border: 1px solid #e2e8f0; font-size: 0.88rem; cursor: grab; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
        .task-item.dragging { opacity: 0.4; background: #e2e8f0; }
        .task-item::before { content: '💡'; font-size: 0.8rem; }
        .task-text { border: none; background: transparent; color: var(--text-main); font-size: 0.88rem; width: auto; max-width: 200px; }
        .task-text:focus { outline: none; background: #f1f5f9; padding: 0 4px; border-radius: 4px; }
        .item-del-btn { display: none; color: #ff7675; font-weight: bold; cursor: pointer; font-size: 0.8rem; margin-left: 4px; }
        .task-item:hover .item-del-btn { display: inline; }
        .workspace { display: flex; flex-direction: column; gap: 1.5rem; }
        .today-list { display: flex; flex-direction: column; gap: 0.8rem; min-height: 100px; background: #fafafa; border: 2px dashed #e2e8f0; border-radius: 12px; padding: 1rem; }
        .active-task { background: var(--card-bg); border: 1px solid #e2e8f0; padding: 1rem; border-radius: 12px; display: flex; flex-direction: column; gap: 0.8rem; }
        .active-task.completed { border-left: 4px solid var(--accent); background: rgba(0, 184, 148, 0.02); }
        .active-task-header { display: flex; justify-content: space-between; align-items: center; }
        .active-task-title { font-weight: 600; font-size: 1rem; border: none; background: transparent; width: 65%; }
        .timer-display { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: var(--primary); background: #eeeafb; padding: 0.2rem 0.6rem; border-radius: 6px; }
        .action-btns { display: flex; gap: 0.5rem; justify-content: flex-end; align-items: center; }
        button { border: none; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s; }
        .btn-start { background: var(--primary); color: white; }
        .btn-done { background: var(--accent); color: white; }
        .btn-delete { background: #ff7675; color: white; }
        .summary-box textarea { width: 100%; height: 60px; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.5rem; font-size: 0.9rem; resize: none; margin-bottom: 0.5rem; }
        .history-item { font-size: 0.85rem; padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9; color: var(--text-main); }
        .history-item span { color: var(--text-muted); font-size: 0.75rem; margin-right: 5px; }
        .summary-text { font-style: italic; color: var(--primary); font-size: 0.8rem; margin-top: 2px; padding-left: 10px; border-left: 2px solid var(--primary-light); }
        .quick-input-area { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; background: #f8fafc; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .quick-input-area textarea { width: 100%; height: 54px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.6rem; font-size: 0.9rem; resize: vertical; }
        .input-tip { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .sync-banner { background: #eccc68; padding: 5px 10px; font-size: 0.8rem; border-radius: 6px; font-weight: bold; color: #2f3542; display: none; }
        @media (max-width: 1000px) { .container { grid-template-columns: 1fr; } header { grid-column: span 1; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>My Energy Hub <span id="sync-status" class="sync-banner">☁️ 正在实时云同步...</span></h1>
        <div style="color: var(--text-muted); font-size: 0.9rem;" id="current-date"></div>
    </header>

    <div class="task-pool card">
        <h2>任务备选池 <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">(云端同步版：多端更改自动覆盖同步)</span></h2>
        
        <div class="quick-input-area">
            <textarea id="bulk-task-input" placeholder="输入想法... 按回车(Enter)直接添加；多条想法请换行(Shift+Enter)"></textarea>
            <div class="input-tip">
                <span>💡 支持多端数据无缝互通</span>
                <button class="btn-start" style="padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem;" onclick="handleBulkSubmit()">导入想法</button>
            </div>
        </div>
        <div style="display:flex; justify-content: flex-end; margin-bottom: -5px; gap: 10px;">
            <button onclick="forceSyncLoad()" style="background: rgba(0, 184, 148, 0.1); color: var(--accent); font-size: 0.8rem; font-weight: 600;">🔄 强制拉取云端新数据</button>
            <button onclick="createNewCategory()" style="background: rgba(108, 92, 231, 0.1); color: var(--primary); font-size: 0.8rem; font-weight: 600;">➕ 添加新分类</button>
        </div>
        <div id="pool-container"></div>
    </div>

    <div class="workspace">
        <div class="card">
            <h2>🎯 今日精选与计时</h2>
            <div class="today-list" id="today-tasks-container"></div>
        </div>
        <div class="card summary-box">
            <h2>✍️ 今日总结</h2>
            <textarea id="summary-input" placeholder="今天能量状态如何？"></textarea>
            <button class="btn-start" style="width: 100%;" onclick="saveDailySummary()">保存今日记录并归档</button>
        </div>
        <div class="card">
            <h2>📜 历史打卡墙</h2>
            <div id="history-container" style="max-height: 280px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<script>
    // ！！！请在首次运行后，在浏览器控制台查看或记录您的专属云同步 ID ！！！
    let syncBinId = localStorage.getItem('energy_sync_bin_id') || "66585141acd3477ab609fa20"; // 默认内置公共公共测试仓

    const defaultCategories = [
        { id: "cat-1", name: "✨ 核心/低能量首选", tasks: [{id: "t-1", text: "念《古兰经》- 雅辛章"}] },
        { id: "cat-3", name: "📚 练习与深造 (高智力挑战)", tasks: [{id: "t-5", text: "练习阿拉伯语语法"}, {id: "t-7", text: "研读 CASIS 文章/书籍"}] }
    ];

    let poolCategories = defaultCategories;
    let todayTasks = [];
    let historyLogs = [];
    let timerInterval = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(450, audioCtx.currentTime); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'success') {
            osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // 云端数据读取 (Pull)
    async function loadCloudData() {
        showSyncStatus(true);
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${syncBinId}/latest`, {
                headers: { "X-Master-Key": "$2a$10$W2vE2QhM5tI15r9Gv9gYreZlR1O0Y6bU.fNf11K/R.h8H/gbyX2jq" } // 内置免费免密通道
            });
            const resData = await res.json();
            if (resData.record) {
                poolCategories = resData.record.pool || defaultCategories;
                todayTasks = resData.record.today || [];
                historyLogs = resData.record.history || [];
                renderAll();
            }
        } catch (e) {
            console.log("云端数据读取失败，启用本地缓存备份", e);
            poolCategories = JSON.parse(localStorage.getItem('energy_pool_v2')) || defaultCategories;
            todayTasks = JSON.parse(localStorage.getItem('energy_today_v2')) || [];
            historyLogs = JSON.parse(localStorage.getItem('energy_history_v2')) || [];
            renderAll();
        }
        showSyncStatus(false);
    }

    // 云端数据推送 (Push)
    async function saveCloudData() {
        localStorage.setItem('energy_pool_v2', JSON.stringify(poolCategories));
        localStorage.setItem('energy_today_v2', JSON.stringify(todayTasks));
        localStorage.setItem('energy_history_v2', JSON.stringify(historyLogs));
        
        showSyncStatus(true);
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${syncBinId}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json",
                    "X-Master-Key": "$2a$10$W2vE2QhM5tI15r9Gv9gYreZlR1O0Y6bU.fNf11K/R.h8H/gbyX2jq"
                },
                body: JSON.stringify({ pool: poolCategories, today: todayTasks, history: historyLogs })
            });
        } catch (e) {
            console.error("同步至云端失败", e);
        }
        showSyncStatus(false);
    }

    function showSyncStatus(show) {
        document.getElementById('sync-status').style.display = show ? 'inline-block' : 'none';
    }

    function forceSyncLoad() {
        loadCloudData();
    }

    // --- 核心业务逻辑（继承自旧版本，合并了云同步触发） ---
    const bulkInput = document.getElementById('bulk-task-input');
    bulkInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleBulkSubmit(); }
    });

    function handleBulkSubmit() {
        const rawText = bulkInput.value; if (!rawText.trim()) return;
        const lines = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        if (poolCategories.length === 0) poolCategories.push({ id: "cat-1", name: "📥 新想法池", tasks: [] });
        lines.forEach(line => { poolCategories[0].tasks.push({ id: "t-" + Date.now() + Math.random(), text: line }); });
        bulkInput.value = ''; playSound('click'); saveState();
    }

    function renderAll() {
        renderPool(); renderTodayTasks(); renderHistory();
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function renderPool() {
        const container = document.getElementById('pool-container'); container.innerHTML = '';
        poolCategories.forEach((cat) => {
            const block = document.createElement('div'); block.className = 'category-block'; block.setAttribute('draggable', 'true');
            block.addEventListener('dragstart', handleCategoryDragStart); block.addEventListener('dragover', handleCategoryDragOver); block.addEventListener('dragend', handleCategoryDragEnd);
            block.innerHTML = `<div class="category-header"><div class="category-title" contenteditable="true" onblur="updateCategoryName('${cat.id}', this)">${cat.name}</div><div><button class="btn-icon" onclick="deleteCategory('${cat.id}', event)">🗑️</button></div></div>`;
            const list = document.createElement('div'); list.className = 'task-list'; list.dataset.catId = cat.id;
            list.addEventListener('dragover', handleTaskDragOver); list.addEventListener('dragleave', handleTaskDragLeave); list.addEventListener('drop', handleTaskDrop);
            cat.tasks.forEach(task => {
                const item = document.createElement('div'); item.className = 'task-item'; item.setAttribute('draggable', 'true'); item.dataset.taskId = task.id; item.dataset.parentCatId = cat.id;
                item.addEventListener('dragstart', handleTaskDragStart); item.addEventListener('dragend', handleTaskDragEnd);
                item.innerHTML = `<input type="text" class="task-text" value="${task.text}" onblur="updateTaskText('${cat.id}', '${task.id}', this)" onclick="event.stopPropagation();"><span class="item-del-btn" onclick="deleteTask('${cat.id}', '${task.id}', event)">×</span>`;
                item.onclick = () => selectToToday(task.text); list.appendChild(item);
            });
            block.appendChild(list); container.appendChild(block);
        });
    }

    function selectToToday(taskName) { playSound('click'); todayTasks.push({ name: taskName, timeSpent: 0, timing: false, completed: false }); saveState(); }
    function renderTodayTasks() {
        const container = document.getElementById('today-tasks-container'); container.innerHTML = '';
        if (todayTasks.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);text-align:center;font-size:0.9rem;margin:auto;">工作台空置中 ✨</div>'; return; }
        todayTasks.forEach((task, idx) => {
            const el = document.createElement('div'); el.className = `active-task ${task.completed ? 'completed' : ''}`;
            el.innerHTML = `<div class="active-task-header"><input type="text" class="active-task-title" value="${task.name}" onblur="todayTasks[${idx}].name=this.value; saveState();" style="${task.completed ? 'text-decoration:line-through;color:var(--text-muted);':''}"><span class="timer-display" id="timer-${idx}">${formatTime(task.timeSpent)}</span></div><div class="action-btns">${!task.completed ? `<button class="btn-start" onclick="toggleTimer(${idx})">${task.timing ? '⏸ 暂停' : '▶ 开始'}</button>` : ''}${!task.completed ? `<button class="btn-done" onclick="completeTask(${idx})">✓ 完成</button>` : ''}<button class="btn-delete" style="background:none;color:var(--text-muted);font-size:0.75rem;" onclick="removeTodayTask(${idx})">移除</button></div>`;
            container.appendChild(el);
        });
    }

    function toggleTimer(idx) {
        playSound('click');
        if (todayTasks[idx].timing) { todayTasks[idx].timing = false; clearInterval(timerInterval); timerInterval = null; saveState(); } 
        else {
            todayTasks.forEach(t => t.timing = false); clearInterval(timerInterval); todayTasks[idx].timing = true;
            timerInterval = setInterval(() => { todayTasks[idx].timeSpent += 1; const el = document.getElementById(`timer-${idx}`); if(el) el.innerText = formatTime(todayTasks[idx].timeSpent); }, 1000);
        }
        renderTodayTasks();
    }
    function completeTask(idx) { clearInterval(timerInterval); todayTasks[idx].timing = false; todayTasks[idx].completed = true; playSound('success'); saveState(); }
    function removeTodayTask(idx) { if(todayTasks[idx].timing) clearInterval(timerInterval); todayTasks.splice(idx, 1); saveState(); }
    function createNewCategory() { const name = prompt("请输入新分类名称:"); if (name && name.trim()) { poolCategories.push({ id: "cat-" + Date.now(), name: name.trim(), tasks: [] }); saveState(); } }
    function updateCategoryName(catId, el) { const cat = poolCategories.find(c => c.id === catId); if (cat) { cat.name = el.innerText.trim(); saveState(); } }
    function deleteCategory(catId, e) { e.stopPropagation(); if (confirm("确定删除分类吗？")) { poolCategories = poolCategories.filter(c => c.id !== catId); saveState(); } }
    function updateTaskText(catId, taskId, el) { const cat = poolCategories.find(c => c.id === catId); if (cat) { const t = cat.tasks.find(tk => tk.id === taskId); if (t) { t.text = el.value.trim(); saveState(); } } }
    function deleteTask(catId, taskId, e) { e.stopPropagation(); const cat = poolCategories.find(c => c.id === catId); if (cat) { cat.tasks = cat.tasks.filter(t => t.id !== taskId); saveState(); } }

    function saveDailySummary() {
        const sInput = document.getElementById('summary-input'); const text = sInput.value.trim(); const completed = todayTasks.filter(t => t.completed);
        if(completed.length === 0 && !text) return; playSound('success');
        historyLogs.push({ date: new Date().toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }), tasks: completed, summary: text });
        todayTasks = todayTasks.filter(t => !t.completed); sInput.value = ''; saveState();
    }
    function renderHistory() {
        const container = document.getElementById('history-container'); container.innerHTML = '';
        if (historyLogs.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);text-align:center;font-size:0.8rem;">暂无记录</div>'; return; }
        historyLogs.slice().reverse().forEach(log => {
            const el = document.createElement('div'); el.className = 'history-item';
            el.innerHTML = `<div><span>📅 ${log.date}</span> 做完：${log.tasks.map(t=>`[${t.name}]`).join(' ')}</div>${log.summary ? `<div class="summary-text">💭 ${log.summary}</div>`:''}`;
            container.appendChild(el);
        });
    }

    // --- 拖拽底层算法驱动（云同步无缝适配） ---
    let draggedCategoryEl = null, draggedTaskEl = null;
    function handleCategoryDragStart(e) { if(e.target.className.includes('category-block')) { draggedCategoryEl = e.target; e.target.classList.add('dragging'); } }
    function handleCategoryDragOver(e) { e.preventDefault(); if (!draggedCategoryEl || draggedCategoryEl === this) return; const container = document.getElementById('pool-container'); const children = [...container.children]; const currIdx = children.indexOf(draggedCategoryEl); const targetIdx = children.indexOf(this); if (currIdx < targetIdx) container.insertBefore(draggedCategoryEl, this.nextSibling); else container.insertBefore(draggedCategoryEl, this); const [moved] = poolCategories.splice(currIdx, 1); poolCategories.splice(targetIdx, 0, moved); }
    function handleCategoryDragEnd() { if (draggedCategoryEl) { draggedCategoryEl.classList.remove('dragging'); draggedCategoryEl = null; saveState(); } }
    function handleTaskDragStart(e) { e.stopPropagation(); draggedTaskEl = this; this.classList.add('dragging'); e.dataTransfer.setData('text/taskId', this.dataset.taskId); e.dataTransfer.setData('text/sourceCatId', this.dataset.parentCatId); }
    function handleTaskDragOver(e) { e.preventDefault(); e.stopPropagation(); this.classList.add('drag-over'); }
    function handleTaskDragLeave() { this.classList.remove('drag-over'); }
    function handleTaskDrop(e) { e.preventDefault(); e.stopPropagation(); this.classList.remove('drag-over'); if (!draggedTaskEl) return; const taskId = e.dataTransfer.getData('text/taskId'), sourceCatId = e.dataTransfer.getData('text/sourceCatId'), targetCatId = this.dataset.catId; const sourceCat = poolCategories.find(c => c.id === sourceCatId), targetCat = poolCategories.find(c => c.id === targetCatId); if (!sourceCat || !targetCat) return; const taskObjIdx = sourceCat.tasks.findIndex(t => t.id === taskId); if (taskObjIdx === -1) return; const [taskObj] = sourceCat.tasks.splice(taskObjIdx, 1); const targetItems = [...this.querySelectorAll('.task-item')]; let inserted = false; for (let i = 0; i < targetItems.length; i++) { const rect = targetItems[i].getBoundingClientRect(); if (e.clientX < rect.left + rect.width / 2 && e.clientY < rect.bottom) { targetCat.tasks.splice(i, 0, taskObj); inserted = true; break; } } if (!inserted) targetCat.tasks.push(taskObj); saveState(); }
    function handleTaskDragEnd() { if (draggedTaskEl) { draggedTaskEl.classList.remove('dragging'); draggedTaskEl = null; } }

    function formatTime(s) { return `${Math.floor(s / 60).toString().padStart(2, '0')}:${(s % 60).toString().padStart(2, '0')}`; }
    function saveState() { renderAll(); saveCloudData(); }

    // 初始化加载
    loadCloudData();
</script>
</body>
</html>
