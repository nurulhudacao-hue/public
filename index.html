<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Energy Hub | 智能能量站</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary: #6c5ce7;
            --primary-light: #a29bfe;
            --accent: #00b894;
            --border-radius: 16px;
            --shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem; display: flex; justify-content: center; }
        
        .container { width: 100%; max-width: 1300px; display: grid; grid-template-columns: 1fr 380px; gap: 2rem; }
        
        header { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        header h1 { font-size: 1.8rem; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 10px; }
        header h1::before { content: '✨'; }

        /* 通用卡片样式 */
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 1.5rem; box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.01); }
        .card h2 { font-size: 1.2rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; color: var(--text-main); }

        /* 任务整合池 */
        .task-pool { display: flex; flex-direction: column; gap: 1.2rem; }
        
        /* 分类块拖拽容器 */
        #pool-container { display: flex; flex-direction: column; gap: 1.2rem; }
        
        .category-block { 
            background: rgba(108, 92, 231, 0.02); 
            padding: 1.2rem; 
            border-radius: 12px; 
            border-left: 4px solid var(--primary);
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .category-block:active { cursor: grabbing; }
        .category-block.dragging { opacity: 0.5; background: #efecfd; }
        
        .category-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
        .category-title { font-weight: 600; font-size: 0.95rem; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid transparent; padding: 2px 6px; border-radius: 4px; cursor: text; }
        .category-title:focus { background: white; border-color: var(--primary-light); outline: none; }
        
        .cat-actions { display: flex; gap: 8px; }
        .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.9rem; padding: 2px 4px; border-radius: 4px; transition: all 0.2s; }
        .btn-icon:hover { color: #ff7675; background: rgba(0,0,0,0.05); }

        /* 任务列表容器 */
        .task-list { display: flex; flex-wrap: wrap; gap: 0.6rem; min-height: 35px; padding: 4px; border-radius: 8px; background: rgba(0,0,0,0.01); border: 1px dashed transparent; }
        .task-list.drag-over { border-color: var(--primary-light); background: rgba(108, 92, 231, 0.05); }
        
        /* 任务颗粒（小胶囊设计） */
        .task-item { 
            background: var(--card-bg); 
            padding: 0.4rem 0.9rem; 
            border-radius: 20px; 
            border: 1px solid #e2e8f0; 
            font-size: 0.88rem; 
            cursor: grab; 
            transition: all 0.2s ease; 
            display: inline-flex; 
            align-items: center; 
            gap: 6px; 
            user-select: none; 
        }
        .task-item:active { cursor: grabbing; }
        .task-item:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.06); border-color: var(--primary-light); }
        .task-item.dragging { opacity: 0.4; background: #e2e8f0; }
        .task-item::before { content: '💡'; font-size: 0.8rem; }
        
        .task-text { border: none; background: transparent; color: var(--text-main); font-size: 0.88rem; width: auto; max-width: 200px; cursor: pointer; }
        .task-text:focus { outline: none; background: #f1f5f9; cursor: text; padding: 0 4px; border-radius: 4px; }

        .item-del-btn { display: none; color: #ff7675; font-weight: bold; cursor: pointer; font-size: 0.8rem; margin-left: 4px; }
        .task-item:hover .item-del-btn { display: inline; }

        /* 每日精选工作台 */
        .workspace { display: flex; flex-direction: column; gap: 1.5rem; }
        .today-list { display: flex; flex-direction: column; gap: 0.8rem; min-height: 100px; background: #fafafa; border: 2px dashed #e2e8f0; border-radius: 12px; padding: 1rem; }
        
        .active-task { background: var(--card-bg); border: 1px solid #e2e8f0; padding: 1rem; border-radius: 12px; display: flex; flex-direction: column; gap: 0.8rem; transition: all 0.3s ease; }
        .active-task.completed { border-left: 4px solid var(--accent); background: rgba(0, 184, 148, 0.02); }
        .active-task-header { display: flex; justify-content: space-between; align-items: center; }
        .active-task-title { font-weight: 600; font-size: 1rem; border: none; background: transparent; width: 65%; }
        .active-task-title:focus { outline: none; background: #f1f5f9; padding: 2px 4px; border-radius: 4px; }
        
        /* 计时器与操作 */
        .timer-display { font-family: monospace; font-size: 1.2rem; font-weight: bold; color: var(--primary); background: #eeeafb; padding: 0.2rem 0.6rem; border-radius: 6px; }
        .action-btns { display: flex; gap: 0.5rem; justify-content: flex-end; align-items: center; }
        button { border: none; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.85rem; transition: all 0.2s; }
        .btn-start { background: var(--primary); color: white; }
        .btn-start:hover { background: #5643d4; }
        .btn-done { background: var(--accent); color: white; }
        .btn-done:hover { background: #009675; }
        .btn-delete { background: #ff7675; color: white; }

        /* 每日总结与打卡墙 */
        .summary-box textarea { width: 100%; height: 60px; border-radius: 8px; border: 1px solid #e2e8f0; padding: 0.5rem; font-size: 0.9rem; resize: none; margin-bottom: 0.5rem; }
        .summary-box textarea:focus { outline: none; border-color: var(--primary); }
        .history-item { font-size: 0.85rem; padding: 0.5rem 0; border-bottom: 1px solid #f1f5f9; color: var(--text-main); }
        .history-item span { color: var(--text-muted); font-size: 0.75rem; margin-right: 5px; }
        .summary-text { font-style: italic; color: var(--primary); font-size: 0.8rem; margin-top: 2px; padding-left: 10px; border-left: 2px solid var(--primary-light); }

        /* 批量/分行输入框 */
        .quick-input-area { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem; background: #f8fafc; padding: 10px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .quick-input-area textarea { width: 100%; height: 54px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 0.6rem; font-size: 0.9rem; resize: vertical; transition: border 0.2s; }
        .quick-input-area textarea:focus { outline: none; border-color: var(--primary); background: white; }
        .input-tip { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; padding: 0 4px; }

        @media (max-width: 1000px) {
            .container { grid-template-columns: 1fr; }
            header { grid-column: span 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>My Energy Hub</h1>
        <div style="color: var(--text-muted); font-size: 0.9rem;" id="current-date"></div>
    </header>

    <!-- 左侧：智能动态任务池 -->
    <div class="task-pool card">
        <h2>任务备选池 <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">(分类和想法均可编辑、删除、自由拖拽排序)</span></h2>
        
        <!-- 批量输入框（满足分行拆分及快捷键逻辑） -->
        <div class="quick-input-area">
            <textarea id="bulk-task-input" placeholder="输入想法... 按回车(Enter)直接添加；多条想法请换行(Shift+Enter)，最后敲回车一键拆分导入。"></textarea>
            <div class="input-tip">
                <span>💡 提示: 每一行文本都会自动变成一个独立的备选想法</span>
                <button class="btn-start" style="padding: 0.3rem 0.8rem; border-radius: 6px; font-size: 0.8rem;" onclick="handleBulkSubmit()">导入想法</button>
            </div>
        </div>

        <div style="display:flex; justify-content: flex-end; margin-bottom: -5px;">
            <button onclick="createNewCategory()" style="background: rgba(108, 92, 231, 0.1); color: var(--primary); font-size: 0.8rem; font-weight: 600;">➕ 添加新分类</button>
        </div>

        <!-- 分类及任务容器（支持双层拖拽） -->
        <div id="pool-container"></div>
    </div>

    <!-- 右侧：工作台与日常归档 -->
    <div class="workspace">
        <div class="card">
            <h2>🎯 今日精选与计时</h2>
            <div class="today-list" id="today-tasks-container"></div>
        </div>

        <div class="card summary-box">
            <h2>✍️ 今日总结 <span style="font-size: 0.75rem; color: var(--text-muted);">(限两三句话)</span></h2>
            <textarea id="summary-input" placeholder="今天能量状态如何？写下一两句最真实的反馈..."></textarea>
            <button class="btn-start" style="width: 100%;" onclick="saveDailySummary()">保存今日记录并归档</button>
        </div>

        <div class="card">
            <h2>📜 历史打卡墙</h2>
            <div id="history-container" style="max-height: 280px; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<script>
    // 初始预设数据
    const defaultCategories = [
        { id: "cat-1", name: "✨ 核心/低能量首选", tasks: [{id: "t-1", text: "念《古兰经》- 雅辛章"}, {id: "t-2", text: "念《古兰经》- 寻回内心平静"}] },
        { id: "cat-2", name: "🎙️ 创作与筹备", tasks: [{id: "t-3", text: "准备“微光”系列内容"}, {id: "t-4", text: "录制“微光”音频/视频"}] },
        { id: "cat-3", name: "📚 练习与深造 (高智力挑战)", tasks: [{id: "t-5", text: "练习阿拉伯语语法"}, {id: "t-6", text: "研究教育学前沿理论"}, {id: "t-7", text: "研读 CASIS 文章/书籍"}, {id: "t-8", text: "专注练习写作素养 (15分钟)"}, {id: "t-9", text: "案例深剖：铺满草稿纸硬核推演"}] },
        { id: "cat-4", name: "🌐 调研与探索", tasks: [{id: "t-10", text: "调查印度尼西亚大学信息"}, {id: "t-11", text: "探索最新的 AI 效率工具"}] },
        { id: "cat-5", name: "☕ 休闲与校对", tasks: [{id: "t-12", text: "看一场优质的 Ted Talk"}, {id: "t-13", text: "看一部高分纪录片"}, {id: "t-14", text: "推进论文/手稿校对工作"}] }
    ];

    let poolCategories = JSON.parse(localStorage.getItem('energy_pool_v2')) || defaultCategories;
    let todayTasks = JSON.parse(localStorage.getItem('energy_today_v2')) || [];
    let historyLogs = JSON.parse(localStorage.getItem('energy_history_v2')) || [];
    let timerInterval = null;

    // 自制低延迟音频反馈
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'click') {
            osc.type = 'sine'; osc.frequency.setValueAtTime(450, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(850, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'success') {
            osc.type = 'triangle';
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.08);
            });
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // --- 1. 批量输入与分行模块 ---
    const bulkInput = document.getElementById('bulk-task-input');
    bulkInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (e.shiftKey) {
                // Shift + Return 默认行为即为换行，不做拦截
            } else {
                // 单纯回车：阻止默认换行，执行提交拆分逻辑
                e.preventDefault();
                handleBulkSubmit();
            }
        }
    });

    function handleBulkSubmit() {
        const rawText = bulkInput.value;
        if (!rawText.trim()) return;

        // 按行切割，并过滤掉空行
        const lines = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        if (lines.length === 0) return;

        // 默认将新创建的想法扔进第一个分类中
        if (poolCategories.length === 0) {
            poolCategories.push({ id: "cat-" + Date.now(), name: "📥 新收集池", tasks: [] });
        }

        lines.forEach(line => {
            poolCategories[0].tasks.push({
                id: "t-" + Math.random().toString(36).substr(2, 9),
                text: line
            });
        });

        bulkInput.value = '';
        playSound('click');
        saveState();
        renderPool();
    }

    // --- 2. 核心渲染与编辑、删除功能 ---
    function renderAll() {
        renderPool();
        renderTodayTasks();
        renderHistory();
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('zh-CN', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    function renderPool() {
        const container = document.getElementById('pool-container');
        container.innerHTML = '';

        poolCategories.forEach((cat, catIdx) => {
            const block = document.createElement('div');
            block.className = 'category-block';
            block.setAttribute('draggable', 'true');
            block.dataset.catId = cat.id;

            // 分类块拖拽排序事件
            block.addEventListener('dragstart', handleCategoryDragStart);
            block.addEventListener('dragover', handleCategoryDragOver);
            block.addEventListener('dragend', handleCategoryDragEnd);

            block.innerHTML = `
                <div class="category-header">
                    <div class="category-title" contenteditable="true" onblur="updateCategoryName('${cat.id}', this)">${cat.name}</div>
                    <div class="cat-actions">
                        <button class="btn-icon" title="删除分类" onclick="deleteCategory('${cat.id}', event)">🗑️</button>
                    </div>
                </div>
            `;

            const list = document.createElement('div');
            list.className = 'task-list';
            list.dataset.catId = cat.id;

            // 任务胶囊的跨分类拖拽接收事件
            list.addEventListener('dragover', handleTaskDragOver);
            list.addEventListener('dragleave', handleTaskDragLeave);
            list.addEventListener('drop', handleTaskDrop);

            cat.tasks.forEach(task => {
                const item = document.createElement('div');
                item.className = 'task-item';
                item.setAttribute('draggable', 'true');
                item.dataset.taskId = task.id;
                item.dataset.parentCatId = cat.id;

                // 任务胶囊拖拽事件
                item.addEventListener('dragstart', handleTaskDragStart);
                item.addEventListener('dragend', handleTaskDragEnd);

                // 内置可编辑文本框与删除按钮
                item.innerHTML = `
                    <input type="text" class="task-text" value="${task.text}" 
                        onblur="updateTaskText('${cat.id}', '${task.id}', this)" 
                        onclick="event.stopPropagation();" 
                        onkeydown="if(e.key==='Enter')this.blur()">
                    <span class="item-del-btn" title="删除想法" onclick="deleteTask('${cat.id}', '${task.id}', event)">×</span>
                `;

                // 点击胶囊非文本/按钮区域，选择进入今日精选
                item.onclick = () => selectToToday(task.text);
                list.appendChild(item);
            });

            block.appendChild(list);
            container.appendChild(block);
        });
    }

    // 分类管理操作
    function createNewCategory() {
        const name = prompt("请输入新分类的名称:", "💡 新能量维度");
        if (name && name.trim()) {
            poolCategories.push({ id: "cat-" + Date.now(), name: name.trim(), tasks: [] });
            saveState(); renderPool();
        }
    }

    function updateCategoryName(catId, element) {
        const cat = poolCategories.find(c => c.id === catId);
        if (cat) {
            cat.name = element.innerText.trim() || "未命名分类";
            saveState();
        }
    }

    function deleteCategory(catId, event) {
        event.stopPropagation();
        if (confirm("确定要删除这个分类吗？其中的所有任务也将被清除。")) {
            poolCategories = poolCategories.filter(c => c.id !== catId);
            saveState(); renderPool();
        }
    }

    // 任务单条管理操作
    function updateTaskText(catId, taskId, element) {
        const cat = poolCategories.find(c => c.id === catId);
        if (cat) {
            const task = cat.tasks.find(t => t.id === taskId);
            if (task) {
                task.text = element.value.trim() || "未命名想法";
                saveState();
            }
        }
    }

    function deleteTask(catId, taskId, event) {
        event.stopPropagation();
        const cat = poolCategories.find(c => c.id === catId);
        if (cat) {
            cat.tasks = cat.tasks.filter(t => t.id !== taskId);
            saveState(); renderPool();
        }
    }

    // --- 3. 高级原生双重拖拽算法驱动 ---
    let draggedCategoryEl = null;
    let draggedTaskEl = null;

    // A. 分类块整体拖拽排序
    function handleCategoryDragStart(e) {
        if (e.target.className.includes('category-block')) {
            draggedCategoryEl = e.target;
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/type', 'category');
        }
    }
    function handleCategoryDragOver(e) {
        e.preventDefault();
        if (!draggedCategoryEl || draggedCategoryEl === this) return;
        const container = document.getElementById('pool-container');
        const children = [...container.children];
        const currIdx = children.indexOf(draggedCategoryEl);
        const targetIdx = children.indexOf(this);
        
        if (currIdx < targetIdx) {
            container.insertBefore(draggedCategoryEl, this.nextSibling);
        } else {
            container.insertBefore(draggedCategoryEl, this);
        }
        // 同步底层内存数组
        const [moved] = poolCategories.splice(currIdx, 1);
        poolCategories.splice(targetIdx, 0, moved);
    }
    function handleCategoryDragEnd(e) {
        if (draggedCategoryEl) {
            draggedCategoryEl.classList.remove('dragging');
            draggedCategoryEl = null;
            saveState();
        }
    }

    // B. 任务胶囊跨分类跨顺序拖拽排序
    function handleTaskDragStart(e) {
        e.stopPropagation();
        draggedTaskEl = this;
        this.classList.add('dragging');
        e.dataTransfer.setData('text/type', 'task');
        e.dataTransfer.setData('text/taskId', this.dataset.taskId);
        e.dataTransfer.setData('text/sourceCatId', this.dataset.parentCatId);
    }
    function handleTaskDragOver(e) {
        e.preventDefault(); e.stopPropagation();
        this.classList.add('drag-over');
    }
    function handleTaskDragLeave(e) {
        this.classList.remove('drag-over');
    }
    function handleTaskDrop(e) {
        e.preventDefault(); e.stopPropagation();
        this.classList.remove('drag-over');
        
        const type = e.dataTransfer.getData('text/type');
        if (type !== 'task' || !draggedTaskEl) return;

        const taskId = e.dataTransfer.getData('text/taskId');
        const sourceCatId = e.dataTransfer.getData('text/sourceCatId');
        const targetCatId = this.dataset.catId;

        const sourceCat = poolCategories.find(c => c.id === sourceCatId);
        const targetCat = poolCategories.find(c => c.id === targetCatId);
        if (!sourceCat || !targetCat) return;

        const taskObjIdx = sourceCat.tasks.findIndex(t => t.id === taskId);
        if (taskObjIdx === -1) return;
        const [taskObj] = sourceCat.tasks.splice(taskObjIdx, 1);

        // 计算落点精确定位插入
        const targetItems = [...this.querySelectorAll('.task-item')];
        let inserted = false;
        for (let i = 0; i < targetItems.length; i++) {
            const rect = targetItems[i].getBoundingClientRect();
            if (e.clientX < rect.left + rect.width / 2 && e.clientY < rect.bottom) {
                targetCat.tasks.splice(i, 0, taskObj);
                inserted = true;
                break;
            }
        }
        if (!inserted) targetCat.tasks.push(taskObj);

        saveState(); renderPool();
    }
    function handleTaskDragEnd(e) {
        if (draggedTaskEl) {
            draggedTaskEl.classList.remove('dragging');
            draggedTaskEl = null;
        }
    }

    // --- 4. 今日精选工作台与历史逻辑 ---
    function selectToToday(taskName) {
        playSound('click');
        todayTasks.push({ name: taskName, timeSpent: 0, timing: false, completed: false });
        saveState(); renderTodayTasks();
    }

    function renderTodayTasks() {
        const container = document.getElementById('today-tasks-container');
        container.innerHTML = '';
        if (todayTasks.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted); text-align:center; font-size:0.9rem; margin:auto;">工作台空置中，从左侧挑几个想法扔进来 ✨</div>';
            return;
        }
        todayTasks.forEach((task, idx) => {
            const el = document.createElement('div');
            el.className = `active-task ${task.completed ? 'completed' : ''}`;
            el.innerHTML = `
                <div class="active-task-header">
                    <input type="text" class="active-task-title" value="${task.name}" 
                        onblur="todayTasks[${idx}].name=this.value; saveState();" 
                        style="${task.completed ? 'text-decoration: line-through; color:var(--text-muted);' : ''}">
                    <span class="timer-display" id="timer-${idx}">${formatTime(task.timeSpent)}</span>
                </div>
                <div class="action-btns">
                    ${!task.completed ? `<button class="btn-start" onclick="toggleTimer(${idx})">${task.timing ? '⏸ 暂停' : '▶ 开始'}</button>` : ''}
                    ${!task.completed ? `<button class="btn-done" onclick="completeTask(${idx})">✓ 完成</button>` : ''}
                    <button class="btn-delete" style="background:none; color:var(--text-muted); font-size:0.75rem;" onclick="removeTodayTask(${idx})">移除</button>
                </div>
            `;
            container.appendChild(el);
        });
    }

    function toggleTimer(idx) {
        playSound('click');
        if (todayTasks[idx].timing) {
            todayTasks[idx].timing = false; clearInterval(timerInterval); timerInterval = null;
        } else {
            todayTasks.forEach(t => t.timing = false); clearInterval(timerInterval);
            todayTasks[idx].timing = true;
            timerInterval = setInterval(() => {
                todayTasks[idx].timeSpent += 1;
                const timerEl = document.getElementById(`timer-${idx}`);
                if(timerEl) timerEl.innerText = formatTime(todayTasks[idx].timeSpent);
                localStorage.setItem('energy_today_v2', JSON.stringify(todayTasks));
            }, 1000);
        }
        renderTodayTasks();
    }

    function completeTask(idx) {
        clearInterval(timerInterval); todayTasks[idx].timing = false; todayTasks[idx].completed = true;
        playSound('success'); saveState(); renderTodayTasks();
    }

    function removeTodayTask(idx) {
        if(todayTasks[idx].timing) clearInterval(timerInterval);
        todayTasks.splice(idx, 1); saveState(); renderTodayTasks();
    }

    function saveDailySummary() {
        const summaryInput = document.getElementById('summary-input');
        const summaryText = summaryInput.value.trim();
        const completedTasks = todayTasks.filter(t => t.completed);
        
        if(completedTasks.length === 0 && !summaryText) {
            alert("今天还没有勾选完成任何任务，也没写总结哦~"); return;
        }
        playSound('success');
        historyLogs.push({
            date: new Date().toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' }),
            tasks: completedTasks, summary: summaryText
        });
        todayTasks = todayTasks.filter(t => !t.completed);
        summaryInput.value = '';
        saveState(); renderTodayTasks(); renderHistory();
    }

    function renderHistory() {
        const container = document.getElementById('history-container');
        container.innerHTML = '';
        if (historyLogs.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted); text-align:center; font-size:0.8rem;">暂无归档记录</div>'; return;
        }
        historyLogs.slice().reverse().forEach(log => {
            const el = document.createElement('div'); el.className = 'history-item';
            let tasksList = log.tasks.map(t => `[${t.name} ⏱️${formatTime(t.timeSpent)}]`).join('、');
            el.innerHTML = `
                <div><span>📅 ${log.date}</span> 成功做完：${tasksList || '无精选任务'}</div>
                ${log.summary ? `<div class="summary-text">💭 总结：${log.summary}</div>` : ''}
            `;
            container.appendChild(el);
        });
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    function saveState() {
        localStorage.setItem('energy_pool_v2', JSON.stringify(poolCategories));
        localStorage.setItem('energy_today_v2', JSON.stringify(todayTasks));
        localStorage.setItem('energy_history_v2', JSON.stringify(historyLogs));
    }

    renderAll();
</script>
</body>
</html>
